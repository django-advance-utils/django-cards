{% for group in groups %}
    <div class="{{ group.div_css_class }}" style="{{ group.div_css }}"{% if group.div_id %} id="{{ group.div_id }}"{% endif %}>
        {% if group.group_title %}<h5>{{ group.group_title }}</h5>{% endif %}
        {% for card in group.cards %}
        {{ card.render }}
        {% endfor %}
    </div>
    {% if group.script %}<script>{{ group.script|safe }}</script>{% endif %}
{% endfor %}
<script>
(function () {
    // Bootstrap 4 and Bootstrap 5 both expose tooltip/popover as jQuery plugins, but only
    // when jQuery is on the page before Bootstrap loads -- Bootstrap 5 dropped jQuery as a
    // dependency and registers the plugins opportunistically. Skip rather than throw when
    // it is not there, so the rest of the page still runs.
    if (typeof window.jQuery === 'undefined') return;
    var $ = window.jQuery;
    // Cards emit both the 4 and the 5 spelling; a project's own markup may carry either.
    $(function () {
        $('[data-toggle="tooltip"],[data-bs-toggle="tooltip"]').tooltip({container: 'body'});
        $('[data-toggle="popover"],[data-bs-toggle="popover"]').popover({container: 'body'});
    });
})();
</script>
