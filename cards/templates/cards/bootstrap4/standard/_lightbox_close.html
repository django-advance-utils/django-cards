{% comment %}
    Bootstrap 4 styles .close around a times the markup supplies. Its Bootstrap 5 twin
    is .btn-close, which must be empty and draws its own icon -- the pair cannot be
    carried on one element, which is why it is a template per pack rather than two
    class names on one button.
{% endcomment %}
<button type="button" class="close" aria-label="Close" data-dismiss="modal"><span aria-hidden="true">&times;</span></button>
